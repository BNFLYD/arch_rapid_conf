
# Font, my favorite font is maple mono :)
font_family JetBrainsMono Nerd Font

# Make the cursor shape a beam
shell_integration no-cursor
cursor_shape beam

# Padding (vertical horizontal), matching WezTerm
window_padding_width 8 12

# Scroll back up to 3000 lines.
scrollback_lines 3000

#Default font size.
font_size 11

# Just a keybind to change font size to your liking, it's CTRL + scroll wheel up or down.
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Background opacity, matching WezTerm's Sekaide theme
background_opacity 0.37


# Sekaide colors from the WezTerm configuration
cursor               #47c8c0
cursor_text_color    #000000

selection_background #bec8d1
selection_foreground #99eedd

background           #000000
foreground           #dad4c3

color0               #000000
color8               #999999
color1               #fc3e57
color9               #fc3e57
