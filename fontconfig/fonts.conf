<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>          <!-- tu fuente principal -->
      <family>Symbols Nerd Font</family>       <!-- iconos de Nerd Fonts -->
      <family>M Plus 1 Code</family>        <!-- jp -->
      <family>Noto Color Emoji</family>        <!-- emojis -->
      <family>Red Hat Display</family>        <!-- wide -->
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>M Plus 1 Code</family>        <!-- jp -->
      <family>Noto Color Emoji</family>        <!-- emojis -->
      <family>Red Hat Display</family>        <!-- wide -->
    </prefer>
  </alias>
</fontconfig>
