# La GPU de WSL (/dev/dxg) no responde con esta maquina (RX 580 + driver AMD
# 2023). Mesa cae a ZINK->dzn y aborta con SIGSEGV. Forzar llvmpipe.
# Este archivo lo aplica systemd --user, asi que tambien cubre a las apps
# activadas por D-Bus (ghostty desde wofi, etc.), que no pasan por el shell.
LIBGL_ALWAYS_SOFTWARE=1
